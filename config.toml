baseURL = "https://present.bynoor.io/"
title = "Noor | Show"
theme = "reveal-hugo"
defaultContentLanguage = "en"

[languages.en]
locale = "en-US"
label = "English"
weight = 1

[markup.goldmark.renderer]
unsafe = true

[outputFormats.Reveal]
baseName = "index"
mediaType = "text/html"
isHTML = true

[params.reveal_hugo]
theme = "blood"
history = true
slide_number = false
#highlight_theme = "dracula"
#highlight_theme = "night-owl"
#highlight_theme = "pojoaque"
highlight_theme = "vs2015"
#transition = 'zoom'
#transition_speed = 'fast'
# custom_theme was forcing a near-blank white look over blood
# custom_theme = "reveal-hugo/themes/robot-lung.css"
