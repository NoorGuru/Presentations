baseURL = "https://present.bynoor.io/"
title = "Noor | Presentations"
theme = "reveal-hugo"
defaultContentLanguage = "en"

[languages.en]
locale = "en-US"
label = "English"
weight = 1

[markup.goldmark.renderer]
unsafe = true

[outputFormats.Reveal]
baseName = "index"
mediaType = "text/html"
isHTML = true

[params.reveal_hugo]
theme = "white"
history = true
width = 1920
height = 1080
slide_number = false
highlight_theme = "github"
transition = "slide"
background_transition = "fade"
