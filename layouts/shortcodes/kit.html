<svg class="kit-svg" viewBox="0 0 600 600" role="img" aria-label="A compass. The needle swings to a new path every few seconds: Data, QA, Cloud, UX.">
  <circle class="kt-loop" cx="300" cy="80" r="24"/>
  <rect class="kt-obj" x="278" y="98" width="44" height="26" rx="6"/>
  <circle class="kt-obj is-thick" cx="300" cy="320" r="200"/>
  <circle class="kt-ring" cx="300" cy="320" r="166"/>
  <path class="kt-tick" d="M300 136 V160 M300 480 V504 M116 320 H134 M466 320 H484"/>
  <path class="kt-tick is-thin" d="M172 192 L186 206 M428 192 L414 206 M172 448 L186 434 M428 448 L414 434"/>
  <text class="kt-dir" x="300" y="210" text-anchor="middle">Data</text>
  <text class="kt-dir" x="414" y="330" text-anchor="middle">QA</text>
  <text class="kt-dir" x="300" y="452" text-anchor="middle">Cloud</text>
  <text class="kt-dir" x="186" y="330" text-anchor="middle">UX</text>
  <g transform="translate(300 320)">
    <g class="kt-needle">
      <path class="kt-n-a" d="M0 -80 L20 0 L-20 0 Z"/>
      <path class="kt-n-b" d="M-20 0 L20 0 L0 80 Z"/>
      <circle class="kt-obj" r="15"/>
    </g>
  </g>
  <text class="kt-hand is-white" x="300" y="582" text-anchor="middle">New semester. New direction.</text>
</svg>

      <path class="kt-pen-tip" d="M-5 52 L0 64 L5 52 Z"/>
    </g>
  </g>
</svg>
